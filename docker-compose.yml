services:

  mi-api:
    image: kennethreitz/httpbin
    networks:
      - red_interna

  # El recepcionista 
  apache-proxy:
    image: bitnamilegacy/apache:2.4
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./apache/proxy.conf:/opt/bitnami/apache/conf/vhosts/proxy.conf
      - ./certs:/opt/bitnami/apache/conf/certs
    networks:
      - red_interna
      - red_publica
  
  kong:
    image: kong:3.4.0-ubuntu
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yaml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001 
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr 
    volumes:
      - ./kong.yaml:/usr/local/kong/declarative/kong.yaml
    ports:
      - "8000:8000"
    networks:
      - red_interna
      - red_publica

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # Mapeo interno para historial de métricas
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - red_interna
    
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/dashboards
      # Mapeo interno para guardar sesiones, contraseñas y base de datos de Grafana
      - grafana_data:/var/lib/grafana
    networks:
      - red_interna
      - red_publica

networks:
  red_interna:
    internal: true
    driver: bridge
  red_publica:
    driver: bridge

# Declaración global de discos duros virtuales
volumes:
  prometheus_data:
  grafana_data: