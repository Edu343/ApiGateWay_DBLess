_format_version: "3.0"

services:
  - name: servicio-mi-api
    host: mi-api
    port: 80
    protocol: http
    routes:
      - name: ruta-visual
        paths:
          - /visual
        strip_path: true
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
        
          

consumers:
  - username: ${{ env DECK_CONSUMER_APP_NAME}}
    keyauth_credentials:
      - id: a${{ env DECK_SECRETO_CONSUMER_ID}}
        key: ${{ env DECK_SECRETO_APIKEY}}
  - username: ${{ env DECK_CONSUMER_NAME}}

jwt_secrets:
  - consumer: ${{ env DECK_CONSUMER_NAME_KEYCLOAK}}
    algorithm: RS256
    key: ${{ env DECK_SECRETO_CONSUMER_KEY}}
    rsa_public_key : |
      -----BEGIN PUBLIC KEY-----
      ${{ env DECK_SECRETO_PUBLIC_KEY}}
      -----END PUBLIC KEY-----


plugins:
  - name: prometheus
  
  - name: jwt
    config:
      claims_to_verify:
        - exp

  - name: opentelemetry
    config:
      # Apuntamos al contenedor interno de Jaeger en el puerto OTLP
      endpoint: ${{ env DECK_SECRETO_OPENTELEMETRY_ENDPOINT}}
      resource_attributes:
        service.name: api-gateway-pasantia