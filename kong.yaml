_format_version: "3.0"

services:
  - name: servicio-mi-api
    host: mi-api
    port: 80
    protocol: http
    routes:
      - name: ruta-visual
        paths:
          - /visual
        strip_path: true
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
        
consumers:
  # ------------------------------------------------
  # CONSUMIDOR 1: App Móvil (Usa API Key)
  # ------------------------------------------------
  - username: ${{ env "DECK_CONSUMER_APP_NAME" }}
    keyauth_credentials:
      - id: ${{ env "DECK_SECRETO_CONSUMER_ID" }}
        key: ${{ env "DECK_SECRETO_APIKEY" }}
        
  # ------------------------------------------------
  # CONSUMIDOR 2: Keycloak (Usa JWT)
  # ------------------------------------------------
  - username: ${{ env "DECK_CONSUMER_NAME_KEYCLOAK" }}
    jwt_secrets:
      - algorithm: RS256
        key: ${{ env "DECK_SECRETO_CONSUMER_KEY" }}
        secret: ${{ env "DECK_SECRETO_KEY_SECRETO"}}
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          ${{ env "DECK_SECRETO_PUBLIC_KEY" }}
          -----END PUBLIC KEY-----

plugins:
  - name: prometheus
  
  - name: jwt
    config:
      claims_to_verify:
        - exp

  - name: opentelemetry
    config:
      endpoint: ${{ env "DECK_SECRETO_OPENTELEMETRY_ENDPOINT" }}
      resource_attributes:
        service.name: api-gateway-pasantia