_format_version: "3.0"
consumers:
- keyauth_credentials:
  - key: DECK_SECRETO_APP
  username: manuel-app-movil
services:
- connect_timeout: 60000
  host: mi-api
  name: servicio-mi-api
  port: 80
  protocol: http
  read_timeout: 60000
  routes:
  - name: ruta-visual
    paths:
    - /visual
    plugins:
    - config:
        key_names:
        - apikey
      name: key-auth
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    strip_path: true
  write_timeout: 60000
